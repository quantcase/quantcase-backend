upstream qc-backend {
    server localhost:8000;
}

upstream qc-queue {
    server localhost:9000;
}

server {
    server_name api-dev.quantcase.ai;
    client_max_body_size 100M;
    location ~ / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://qc-backend;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api-dev.quantcase.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api-dev.quantcase.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name queue-dev.quantcase.ai;
    client_max_body_size 100M;
    location ~ / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_pass http://qc-queue;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api-dev.quantcase.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api-dev.quantcase.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api-dev.quantcase.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name api-dev.quantcase.ai;
    listen 80;
    return 404; # managed by Certbot


}

server {
    if ($host = queue-dev.quantcase.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name queue-dev.quantcase.ai;
    listen 80;
    return 404; # managed by Certbot


}