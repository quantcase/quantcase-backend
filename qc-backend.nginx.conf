upstream qc-backend {
    server localhost:8000;
}

server {
    server_name qc-backend.mach33.club;
    location ~ / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://qc-backend;
    }
}